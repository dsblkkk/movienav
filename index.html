        align-items: center;

      .logo-container {

        align-items: center;
        gap: 12px;
      }

      .logo {

        height: 32px;

      .site-name {

        font-weight: 600;
        letter-spacing: 0.5px;

      .logo:hover {

      .main-content {

        gap: 24px;
        margin-top: 20px;
      }

      .site-card {
        background: #0f1623;
        border-radius: 4px;
        overflow: hidden;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        cursor: pointer;
        padding: 24px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        position: relative;
      }

      .site-card:hover {
        transform: scale(1.03);
        background: #1a2639;
      }

      .site-title {
        font-size: 1.3rem;
        margin-bottom: 12px;
        color: #fff;
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 600;
      }

      .site-icon {
        width: 28px;
        height: 28px;
        color: #00d4ff;
        transition: all 0.3s ease;
      }

      .site-card:hover .site-icon {
        transform: scale(1.1);
      }

      .site-desc {
        font-size: 0.95rem;
        color: #8899aa;
        line-height: 1.6;
        margin-bottom: 16px;
      }

      .site-tags {
        display: flex;
        gap: 8px;
        margin-top: 12px;
        flex-wrap: wrap;
      }

      .tag {
        background: rgba(0, 212, 255, 0.1);
        color: #00d4ff;
        padding: 6px 12px;
        border-radius: 2px;
        font-size: 0.85rem;
        font-weight: 500;
        letter-spacing: 0.3px;
        transition: all 0.2s ease;
      }

      .site-card:hover .tag {
        background: rgba(0, 212, 255, 0.15);
        color: #66e0ff;
      }

        .header {

          height: 28px;

        .site-card {

        }

        .site-title {
          font-size: 1.2rem;
        }

        .site-desc {
          font-size: 0.9rem;
        }
      }

      @media (max-width: 480px) {
        .sites-grid {
          grid-template-columns: 1fr;

        }

        }

        .site-name {
          font-size: 1.1rem;
        }

        .section-title {

    <script>
      window.addEventListener("scroll", () => {
        const header = document.querySelector(".header");
        if (window.scrollY > 50) {
          header.style.background = "#0a0e1a";
        } else {
          header.style.background =
            "linear-gradient(180deg, rgba(10, 14, 26, 0.95) 0%, rgba(10, 14, 26, 0.75) 50%, rgba(10, 14, 26, 0) 100%)";
        }
      });

      document.addEventListener("DOMContentLoaded", () => {
        const template = document.getElementById("site-card-template");
        const container = document.getElementById("sites-container");
        const sitesData = JSON.parse(
          document.getElementById("sites-data").textContent
        );

        sitesData.sites.forEach((site) => {
          const card = template.content.cloneNode(true);

          // 设置点击事件
          card.querySelector(".site-card").onclick = () =>
            window.open(site.url);

          // 设置图标和标题
          const icon = card.querySelector(".site-icon");
          icon.className = `${site.icon} site-icon`;
          card.querySelector(".title-text").textContent = site.name;

          // 设置描述
          card.querySelector(".site-desc").textContent = site.description;

          // 设置标签
          const tagsContainer = card.querySelector(".site-tags");
          site.tags.forEach((tag) => {
            const span = document.createElement("span");
            span.className = "tag";
            span.textContent = tag;
            tagsContainer.appendChild(span);
          });

          container.appendChild(card);
        });

        // 设置动态备案年份
        document.getElementById('current-year').textContent = new Date().getFullYear();
      });
    </script>
